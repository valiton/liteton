[package]
name = "liteton"
version = "0.1.0"
edition = "2024"
description = "Set up VSCode, Cursor and opencode to use a LiteLLM proxy, and check your LiteLLM budget"
license-file = "LICENSE"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
cliclack = "0.5.6"
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
crossterm = "0.29.0"
dirs = "7.0.0"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json"] }
pbkdf2 = "0.13.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11.0"
similar = "3.2.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
